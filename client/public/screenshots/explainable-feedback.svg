<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#07101B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2238"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg2)"/>

  <!-- Centered Modal Frame -->
  <rect x="150" y="40" width="900" height="670" rx="24" fill="url(#cardGrad)" stroke="#1B3A60" stroke-width="2"/>

  <!-- Modal Header -->
  <rect x="150" y="40" width="900" height="90" rx="24" fill="#0B192C"/>
  <rect x="180" y="65" width="110" height="26" rx="13" fill="#52D68A" opacity="0.15" stroke="#52D68A" stroke-width="1"/>
  <text x="195" y="82" fill="#52D68A" font-family="Inter, sans-serif" font-weight="700" font-size="12">Score: 88 / 100</text>
  <rect x="300" y="65" width="130" height="26" rx="13" fill="#38BDF8" opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
  <text x="315" y="82" fill="#38BDF8" font-family="Inter, sans-serif" font-weight="700" font-size="12">Confidence: High</text>
  <text x="180" y="115" fill="#FFFFFF" font-family="Outfit, Inter, sans-serif" font-weight="800" font-size="22">Explainable Assessment &amp; Evidence Audit</text>

  <!-- SHAP Feature Attribution Chart Box -->
  <rect x="180" y="150" width="840" height="180" rx="16" fill="#07101B" stroke="#1B3A60" stroke-width="1"/>
  <text x="205" y="180" fill="#52D68A" font-family="Inter, sans-serif" font-weight="700" font-size="13">SHAP Local Feature Attribution (Why this score was awarded)</text>
  
  <!-- Dimension Bars -->
  <text x="205" y="215" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Correctness &amp; Logic</text>
  <rect x="360" y="205" width="340" height="12" rx="6" fill="#52D68A"/>
  <text x="715" y="216" fill="#52D68A" font-family="Inter, sans-serif" font-weight="700" font-size="12">+3.2 pts</text>

  <text x="205" y="245" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">System Scalability</text>
  <rect x="360" y="235" width="280" height="12" rx="6" fill="#52D68A"/>
  <text x="655" y="246" fill="#52D68A" font-family="Inter, sans-serif" font-weight="700" font-size="12">+2.4 pts</text>

  <text x="205" y="275" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Tradeoff Discussion</text>
  <rect x="360" y="265" width="160" height="12" rx="6" fill="#38BDF8"/>
  <text x="535" y="276" fill="#38BDF8" font-family="Inter, sans-serif" font-weight="700" font-size="12">+1.5 pts</text>

  <text x="205" y="305" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Edge Cases</text>
  <rect x="360" y="295" width="90" height="12" rx="6" fill="#F43F5E"/>
  <text x="465" y="306" fill="#F43F5E" font-family="Inter, sans-serif" font-weight="700" font-size="12">-0.8 pts</text>

  <!-- Verified Direct Answer Excerpt Evidence -->
  <rect x="180" y="350" width="840" height="150" rx="16" fill="#0B192C" stroke="#1B3A60" stroke-width="1"/>
  <text x="205" y="380" fill="#38BDF8" font-family="Inter, sans-serif" font-weight="700" font-size="13">Grounded Answer Evidence Excerpt</text>
  <rect x="205" y="395" width="790" height="85" rx="10" fill="#07101B" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="225" y="425" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="12">
    "By using a doubly linked list combined with a hash map, we ensure O(1) removals and updates..."
  </text>
  <text x="225" y="455" fill="#86EFAC" font-family="Inter, sans-serif" font-size="11 font-weight-bold">
    ✓ Substring verified against candidate submission (Zero AI hallucination)
  </text>

  <!-- Counterfactual Actionable Roadmap -->
  <rect x="180" y="520" width="840" height="160" rx="16" fill="#0B192C" stroke="#1B3A60" stroke-width="1"/>
  <text x="205" y="550" fill="#F59E0B" font-family="Inter, sans-serif" font-weight="700" font-size="13">Actionable Counterfactual Guidance (How to gain the missing +12 pts)</text>
  <circle cx="220" cy="580" r="4" fill="#F59E0B"/>
  <text x="235" y="584" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13">Explicitly detail eviction order during concurrent writes (adds +8 pts to Concurrency dimension).</text>
  <circle cx="220" cy="610" r="4" fill="#F59E0B"/>
  <text x="235" y="614" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13">Specify memory footprint tradeoffs between linked lists and flat array buffers (adds +4 pts).</text>
</svg>
