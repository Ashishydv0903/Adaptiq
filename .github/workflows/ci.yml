name: AdaptIQ CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-unit-tests:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-minimum-length
      CLIENT_URL: http://localhost:5173
      GEMINI_MODEL: gemini-1.5-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install server dependencies
        run: npm ci --prefix server || npm install --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client || npm install --prefix client

      - name: Code Syntax & Hygiene Lint
        run: npm run lint

      - name: Run Server Test Suite (Self-Contained in Memory)
        run: npm test --prefix server
        env:
          NODE_ENV: test
          ALLOW_UNSAFE_LOCAL_EXEC: 'true'

      - name: Run Client Test Suite
        run: npm test --prefix client

      - name: Build Client (Vite Bundle & Model Assets)
        run: npm run build --prefix client

  playwright-e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://127.0.0.1:27017/adaptiq
      JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-minimum-length
      CLIENT_URL: http://localhost:5173
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      VITE_DEMO_MODE: 'true'
      ALLOW_UNSAFE_LOCAL_EXEC: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix server
          npm install --prefix client

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium
        working-directory: ./client

      - name: Seed Demo Database
        run: npm run seed:demo --prefix server

      - name: Start Server in Background
        run: npm start --prefix server &
        env:
          NODE_ENV: test
          PORT: 5000

      - name: Start Client Preview Server in Background
        run: |
          npm run build --prefix client
          npx vite preview --port 5173 &
        working-directory: ./client

      - name: Wait for Frontend & Backend Availability
        run: |
          npx wait-on http://localhost:5000/api/health http://localhost:5173 --timeout 60000

      - name: Execute Playwright E2E Suite
        run: npm run test:e2e --prefix client
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_DEMO_MODE: 'true'

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7
